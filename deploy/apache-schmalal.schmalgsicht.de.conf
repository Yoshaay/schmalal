# /etc/apache2/sites-available/schmalal.schmalgsicht.de.conf
# Schmalsoft Produkt-Konvention, Abschnitt 4. Danach:
#   a2ensite schmalal.schmalgsicht.de && systemctl reload apache2
#   certbot --apache -d schmalal.schmalgsicht.de
# certbot ergänzt den :443-vhost; LimitRequestBody/Timeouts dort ebenfalls setzen.

<VirtualHost *:80>
    ServerName schmalal.schmalgsicht.de
    DocumentRoot /var/www/schmalal.schmalgsicht.de/public

    # LALAL nimmt große Audiodateien — Puffer über SCHMALAL_MAX_BYTES (100 MB).
    LimitRequestBody 209715200
    Timeout 300
    ProxyTimeout 300

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8002/
    ProxyPassReverse / http://127.0.0.1:8002/
    RequestHeader set X-Forwarded-Proto "https"

    # Eigene Log-Dateien je Domain (Regel 9): der Hub liest Traffic daraus.
    ErrorLog ${APACHE_LOG_DIR}/schmalal.schmalgsicht.de-error.log
    CustomLog ${APACHE_LOG_DIR}/schmalal.schmalgsicht.de-access.log combined
</VirtualHost>
